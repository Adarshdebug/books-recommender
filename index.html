<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommender System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f6fa;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            background-color: #2f3640;
            color: white;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background-color: white;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            padding: 10px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            height: 200px;
            width: 140px;
            border-radius: 5px;
        }

        .card h3 {
            font-size: 16px;
            margin: 10px 0 5px;
        }

        .card p {
            color: gray;
            font-size: 14px;
            margin: 3px 0;
        }

        .rating {
            color: #f39c12;
            font-weight: bold;
        }

        .recommend-link {
            text-align: center;
            margin: 30px 0;
        }

        .recommend-link a {
            text-decoration: none;
            background-color: #273c75;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .recommend-link a:hover {
            background-color: #40739e;
        }
    </style>
</head>
<body>
    <h1>📚 Book Recommender System</h1>

    <div class="recommend-link">
        <a href="/recommend">Go to Recommendation Page →</a>
    </div>

    <div class="container">
        {% for i in range(book_name|length) %}
        <div class="card">
            <img src="{{ image[i] }}" alt="{{ book_name[i] }}">
            <h3>{{ book_name[i] }}</h3>
            <p><i>{{ author[i] }}</i></p>
            <p>⭐ {{ rating[i] }} ({{ votes[i] }} votes)</p>
        </div>
        {% endfor %}
    </div>
</body>
</html>
